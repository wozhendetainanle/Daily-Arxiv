<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>3D & Physics · Daily arXiv</title>
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <p class="eyebrow">DAILY ARXIV / 3D + PHYSICS</p>
        <h1>3D 与物理交叉论文</h1>
        <p class="subtitle">三维感知与生成、物理动力学、接触交互、仿真和机器人。</p>
      </div>
      <a class="repo-link" href="https://github.com/wozhendetainanle/Daily-Arxiv">GitHub 仓库 ↗</a>
    </header>

    <section class="toolbar" aria-label="论文筛选">
      <label class="select-wrap">日期 <select id="date-select"></select></label>
      <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索标题、作者、分类" aria-label="搜索论文"></label>
      <span id="count" class="count"></span>
      <a id="report-link" class="report-link" href="#">阅读完整中文日报 ↗</a>
    </section>

    <nav id="topics" class="topics" aria-label="主题筛选"></nav>
    <section id="cards" class="cards" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>这个筛选下没有论文。</p>
    <footer>标题、作者和分类来自日报所引 arXiv 页面。相关性和主题标签是整理与推断；配图仅使用有明确来源的论文或项目图片。</footer>
  </main>
</body>
</html>
